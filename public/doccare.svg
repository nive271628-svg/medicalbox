  <line x1="50" y1="28" x2="50" y2="22" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="14" cy="21" r="3" fill="white"/>
  <circle cx="50" cy="21" r="3" fill="white"/>

  <!-- Cross symbol on chest piece -->
  <line x1="32" y1="41" x2="32" y2="47" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="44" x2="35" y2="44" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
