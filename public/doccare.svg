  <circle cx="32" cy="32" r="32" fill="#2563EB"/>

  <!-- Stethoscope head (chest piece) -->
  <circle cx="32" cy="44" r="6" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="32" cy="44" r="2.5" fill="white"/>

  <!-- Stethoscope tube -->
  <path d="M26 44 C18 44 14 36 14 28" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M38 44 C46 44 50 36 50 28" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Earpieces -->
